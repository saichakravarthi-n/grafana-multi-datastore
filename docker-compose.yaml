services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
    build:
      args:
        grafana_image: grafana
        development: 'false'

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: grafana
      MYSQL_PASSWORD: grafana
    volumes:
      - ./dev/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
    volumes:
      - ./dev/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grafana -d demo']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
