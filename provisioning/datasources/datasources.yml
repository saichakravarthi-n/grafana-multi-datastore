apiVersion: 1

datasources:
  - name: Multi Datastore
    type: local-multidatastore-datasource
    uid: multidatastore
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      maxListSize: 1000

  - name: Multi Datastore Small Cap
    type: local-multidatastore-datasource
    uid: multidatastore-cap
    access: proxy
    orgId: 1
    version: 1
    editable: true
    jsonData:
      maxListSize: 1

  - name: MySQL
    type: mysql
    uid: mysql
    access: proxy
    orgId: 1
    url: mysql:3306
    user: grafana
    version: 1
    editable: true
    jsonData:
      database: demo
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: grafana

  - name: PostgreSQL
    type: postgres
    uid: postgres
    access: proxy
    orgId: 1
    url: postgres:5432
    user: grafana
    version: 1
    editable: true
    jsonData:
      database: demo
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: grafana
